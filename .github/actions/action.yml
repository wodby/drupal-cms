name: Build
description: Build Drupal image
inputs:
  version:
    description: drupal cms version
    required: true
  php_ver:
    description: php version
    required: true
  workdir:
    description: working directory
    required: true
  tags:
    description: image tags
    required: true
  platform:
    description: drupal platform
    required: false
    default: linux/amd64
runs:
  using: "composite"
  steps:
  - name: Build image
    id: brotli-image
    env:
      DRUPAL_CMS_VER: ${{ inputs.version }}
      PHP_VER: ${{ inputs.php_ver }}
      TAGS: ${{ inputs.tags }}
      PLATFORM: ${{ inputs.platform }}
    run: |
      set -e
      make buildx-build-amd64
      make test
      make buildx-build
      . $GITHUB_ACTION_PATH/release.sh
    shell: bash
    working-directory: ${{ inputs.workdir }}
      echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
  - name: Verify Brotli security fixes
    uses: wodby/images/.github/actions/check-brotli@4d79323d1d62295e425a222e8cb23ccf843cbbea
    with:
      image: ${{ steps.brotli-image.outputs.image }}
